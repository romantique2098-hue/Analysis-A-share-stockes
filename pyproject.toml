[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquant"
version = "0.1.0"
description = "面向个人研究的 A 股日频量化分析与模拟盘系统"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "akshare>=1.18.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
aquant = "aquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aquant = ["default_settings.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
